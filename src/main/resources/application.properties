spring.application.name=SmartRoad-Backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=classpath:dbConfig.properties

# Database Configuration
spring.datasource.url=${DATABASE_URL:${spring.datasource.url}}
spring.datasource.username=${DATABASE_USERNAME:${spring.datasource.username}}
spring.datasource.password=${DATABASE_PASSWORD:${spring.datasource.password}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlation_id}] %-5level %logger{36} - %msg%n
logging.level.com.smartroad.services=INFO

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# OAuth2 Configuration (Google) - Disabled, no credentials provided
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth2/callback/google}
# spring.security.oauth2.client.registration.google.scope=email,profile

# OAuth2 Configuration (Apple) - Disabled, no credentials provided
# apple.client-id=${APPLE_CLIENT_ID:}
# apple.team-id=${APPLE_TEAM_ID:}
# apple.key-id=${APPLE_KEY_ID:}
# apple.private-key=${APPLE_PRIVATE_KEY:}
# apple.redirect-uri=${APPLE_REDIRECT_URI:http://localhost:8080/oauth2/callback/apple}

# Notification Configuration
# SMS Provider: mock (default for dev), twilio (production)
notification.sms.provider=${NOTIFICATION_SMS_PROVIDER:mock}
# Email Provider: mock (default for dev), smtp (Gmail/real SMTP delivery)
notification.email.provider=${NOTIFICATION_EMAIL_PROVIDER:mock}

# OTP Configuration
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# Email SMTP Configuration (used when notification.email.provider=smtp)
# Gmail SMTP: set MAIL_USERNAME to the Gmail address and MAIL_PASSWORD to a
# Gmail App Password (NOT the normal account password). Credentials must only
# ever be supplied via environment variables - never hardcode them here.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Visible "From" address for OTP emails. Falls back to MAIL_USERNAME when unset.
otp.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SMS Twilio Configuration (for real SMS delivery)
# twilio.account-sid=${TWILIO_ACCOUNT_SID:}
# twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
