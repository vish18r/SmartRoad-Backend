spring.application.name=Nextenti-Backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=classpath:dbConfig.properties

# Database Configuration
spring.datasource.url=${DATABASE_URL:${spring.datasource.url}}
spring.datasource.username=${DATABASE_USERNAME:${spring.datasource.username}}
spring.datasource.password=${DATABASE_PASSWORD:${spring.datasource.password}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlation_id}] %-5level %logger{36} - %msg%n
logging.level.com.nextenti.services=INFO

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# OAuth2 Configuration (Google) - Disabled, no credentials provided
