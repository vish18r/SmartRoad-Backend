<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoad Site Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); padding: 30px 0; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        header h1 { font-size: 28px; font-weight: 700; }
        header p { font-size: 14px; opacity: 0.9; margin-top: 5px; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; transition: all 0.3s; }
        .card:hover { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: #60a5fa; }

        .btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.3s; }
        .btn:hover { background: #2563eb; }
        .btn.secondary { background: #64748b; }
        .btn.secondary:hover { background: #475569; }
        .btn.success { background: #10b981; }
        .btn.success:hover { background: #059669; }
        .btn.danger { background: #ef4444; }
        .btn.danger:hover { background: #dc2626; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #cbd5e1; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 14px; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #3b82f6; }

        .status { padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .status.success { background: #10b981; background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; }
        .status.error { background: #ef4444; background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; }
        .status.info { background: #3b82f6; background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .tabs { display: flex; gap: 10px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .tab { padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .tab.active { border-bottom-color: #3b82f6; color: #3b82f6; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .photo-preview { width: 100%; height: 200px; background: #0f172a; border: 2px dashed #334155; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-top: 10px; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 6px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: #60a5fa; }
        .stat-label { font-size: 12px; color: #94a3b8; margin-top: 5px; }

        .list { background: #1e293b; border: 1px solid #334155; border-radius: 6px; overflow: hidden; }
        .list-item { padding: 15px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .list-item:last-child { border-bottom: none; }
        .list-item-title { font-weight: 600; }
        .list-item-meta { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🚧 SmartRoad Site Tracking Dashboard</h1>
            <p>Real-time construction site management & compliance</p>
        </div>
    </header>

    <div class="container">
        <!-- Stats -->
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="workersToday">0</div>
                <div class="stat-label">Workers Today</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="photosCount">0</div>
                <div class="stat-label">Photos Uploaded</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="qrScans">0</div>
                <div class="stat-label">QR Scans</div>
            </div>
        </div>

        <!-- Status Message -->
        <div id="statusMsg" class="status info" style="display: none;"></div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('checkin')">📍 Check-in/Out</div>
            <div class="tab" onclick="switchTab('photo')">📸 Photos</div>
            <div class="tab" onclick="switchTab('qr')">📱 QR Scan</div>
            <div class="tab" onclick="switchTab('reports')">📊 Reports</div>
        </div>

        <!-- Check-in/Check-out Tab -->
        <div id="checkin" class="tab-content active">
            <div class="dashboard">
                <div class="card">
                    <h2>🟢 Worker Check-in</h2>
                    <div class="input-group">
                        <label>Project ID</label>
                        <input type="text" id="checkinProjectId" placeholder="Enter project UUID" value="00000000-0000-0000-0000-000000000001">
                    </div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Latitude</label>
                            <input type="number" id="checkinLat" placeholder="Latitude" value="28.6139" step="0.0001">
                        </div>
                        <div class="input-group">
                            <label>Longitude</label>
                            <input type="number" id="checkinLng" placeholder="Longitude" value="77.2090" step="0.0001">
                        </div>
                    </div>
                    <button class="btn success" onclick="workerCheckin()">Check In</button>
                </div>

                <div class="card">
                    <h2>🔴 Worker Check-out</h2>
                    <div class="input-group">
                        <label>Project ID</label>
                        <input type="text" id="checkoutProjectId" placeholder="Enter project UUID" value="00000000-0000-0000-0000-000000000001">
                    </div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Latitude</label>
                            <input type="number" id="checkoutLat" placeholder="Latitude" value="28.6139" step="0.0001">
                        </div>
                        <div class="input-group">
                            <label>Longitude</label>
                            <input type="number" id="checkoutLng" placeholder="Longitude" value="77.2090" step="0.0001">
                        </div>
                    </div>
                    <button class="btn danger" onclick="workerCheckout()">Check Out</button>
                </div>
            </div>
        </div>

        <!-- Photo Tab -->
        <div id="photo" class="tab-content">
            <div class="card">
                <h2>📸 Upload Work Photo</h2>
                <div class="input-group">
                    <label>Project ID</label>
                    <input type="text" id="photoProjectId" placeholder="Enter project UUID" value="00000000-0000-0000-0000-000000000001">
                </div>
                <div class="input-group">
                    <label>Photo Type</label>
                    <select id="photoType">
                        <option>BEFORE</option>
                        <option>AFTER</option>
                        <option>DAILY</option>
                        <option>EVIDENCE</option>
                    </select>
                </div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Latitude</label>
                        <input type="number" id="photoLat" placeholder="Latitude" value="28.6139" step="0.0001">
                    </div>
                    <div class="input-group">
                        <label>Longitude</label>
                        <input type="number" id="photoLng" placeholder="Longitude" value="77.2090" step="0.0001">
                    </div>
                </div>
                <div class="input-group">
                    <label>Photo URL (or paste image URL)</label>
                    <input type="text" id="photoUrl" placeholder="https://example.com/photo.jpg" value="https://via.placeholder.com/600x400?text=Construction+Photo">
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="photoDesc" placeholder="Photo description" rows="3"></textarea>
                </div>
                <div class="input-group">
                    <label>Work Area</label>
                    <input type="text" id="photoArea" placeholder="e.g., Foundation, Column A, Floor 3" value="Foundation">
                </div>
                <button class="btn success" onclick="uploadPhoto()">Upload Photo</button>
                <div class="photo-preview" id="photoPreview" style="display: none;">
                    <img id="previewImg" style="max-width: 100%; max-height: 200px;">
                </div>
            </div>
        </div>

        <!-- QR Scan Tab -->
        <div id="qr" class="tab-content">
            <div class="card">
                <h2>📱 Scan QR Code</h2>
                <div class="input-group">
                    <label>Project ID</label>
                    <input type="text" id="qrProjectId" placeholder="Enter project UUID" value="00000000-0000-0000-0000-000000000001">
                </div>
                <div class="input-group">
                    <label>QR Code Value</label>
                    <input type="text" id="qrCode" placeholder="Enter QR code or scan with camera" value="MAT-CEMENT-001">
                </div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Latitude</label>
                        <input type="number" id="qrLat" placeholder="Latitude" value="28.6139" step="0.0001">
                    </div>
                    <div class="input-group">
                        <label>Longitude</label>
                        <input type="number" id="qrLng" placeholder="Longitude" value="77.2090" step="0.0001">
                    </div>
                </div>
                <button class="btn success" onclick="scanQR()">Scan</button>
            </div>
        </div>

        <!-- Reports Tab -->
        <div id="reports" class="tab-content">
            <div class="card">
                <h2>📊 Daily Reports</h2>
                <div class="input-group">
                    <label>Project ID</label>
                    <input type="text" id="reportProjectId" placeholder="Enter project UUID" value="00000000-0000-0000-0000-000000000001">
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="reportDate">
                </div>
                <button class="btn" onclick="getReports()">Get Reports</button>

                <div id="reportsList" class="list" style="margin-top: 20px; display: none;">
                    <!-- Reports will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/smartroad/tracking';
        const getToken = () => localStorage.getItem('token') || 'demo-token';

        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMsg');
            el.textContent = message;
            el.className = `status ${type}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        async function workerCheckin() {
            const data = {
                projectId: document.getElementById('checkinProjectId').value,
                latitude: parseFloat(document.getElementById('checkinLat').value),
                longitude: parseFloat(document.getElementById('checkinLng').value),
                accuracy: 10
            };
            try {
                const res = await fetch(`${API_BASE}/checkin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showStatus('✅ Check-in successful!', 'success');
                    document.getElementById('workersToday').textContent = parseInt(document.getElementById('workersToday').textContent) + 1;
                } else showStatus('❌ Check-in failed', 'error');
            } catch (e) {
                showStatus(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function workerCheckout() {
            const data = {
                projectId: document.getElementById('checkoutProjectId').value,
                latitude: parseFloat(document.getElementById('checkoutLat').value),
                longitude: parseFloat(document.getElementById('checkoutLng').value),
                accuracy: 10
            };
            try {
                const res = await fetch(`${API_BASE}/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(data)
                });
                if (res.ok) showStatus('✅ Check-out successful!', 'success');
                else showStatus('❌ Check-out failed', 'error');
            } catch (e) {
                showStatus(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function uploadPhoto() {
            const photoUrl = document.getElementById('photoUrl').value;
            if (photoUrl) {
                document.getElementById('previewImg').src = photoUrl;
                document.getElementById('photoPreview').style.display = 'flex';
            }

            const data = {
                projectId: document.getElementById('photoProjectId').value,
                photoType: document.getElementById('photoType').value,
                photoUrl: photoUrl,
                latitude: parseFloat(document.getElementById('photoLat').value),
                longitude: parseFloat(document.getElementById('photoLng').value),
                description: document.getElementById('photoDesc').value,
                workArea: document.getElementById('photoArea').value
            };
            try {
                const res = await fetch(`${API_BASE}/photo/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showStatus('✅ Photo uploaded!', 'success');
                    document.getElementById('photosCount').textContent = parseInt(document.getElementById('photosCount').textContent) + 1;
                } else showStatus('❌ Upload failed', 'error');
            } catch (e) {
                showStatus(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function scanQR() {
            const data = {
                projectId: document.getElementById('qrProjectId').value,
                qrCode: document.getElementById('qrCode').value,
                latitude: parseFloat(document.getElementById('qrLat').value),
                longitude: parseFloat(document.getElementById('qrLng').value)
            };
            try {
                const res = await fetch(`${API_BASE}/qr/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showStatus('✅ QR scanned!', 'success');
                    document.getElementById('qrScans').textContent = parseInt(document.getElementById('qrScans').textContent) + 1;
                } else showStatus('❌ Scan failed', 'error');
            } catch (e) {
                showStatus(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function getReports() {
            const projectId = document.getElementById('reportProjectId').value;
            const date = document.getElementById('reportDate').value || new Date().toISOString().split('T')[0];
            try {
                const res = await fetch(`${API_BASE}/photos?projectId=${projectId}&date=${date}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const html = (data || []).map(p => `
                        <div class="list-item">
                            <div>
                                <div class="list-item-title">${p.photoType} - ${p.workArea}</div>
                                <div class="list-item-meta">${p.description}</div>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('reportsList').innerHTML = html || '<div class="list-item">No reports found</div>';
                    document.getElementById('reportsList').style.display = 'block';
                } else showStatus('❌ Failed to load reports', 'error');
            } catch (e) {
                showStatus(`❌ Error: ${e.message}`, 'error');
            }
        }

        // Set today's date
        document.getElementById('reportDate').valueAsDate = new Date();
    </script>
</body>
</html>
