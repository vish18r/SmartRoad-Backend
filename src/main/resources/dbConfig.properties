# Database and JWT configuration.
# All values are resolved from environment variables at runtime -- no credentials are hardcoded here.
# Local dev values go in .env (gitignored); see .env.example for the full list of variables.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nextenti_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

security.jwt.secret-key=${JWT_SECRET:}
security.jwt.expiration-time=${JWT_EXPIRATION:86400000}
