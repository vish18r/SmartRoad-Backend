services:
  postgres:
    image: postgres:16-alpine
    container_name: nextenti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nextenti_db}
      POSTGRES_USER: ${DB_USERNAME:-Vishal_App}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-passVish@l2003}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nextenti_postgres_data:/var/lib/postgresql/data

volumes:
  nextenti_postgres_data:
